# Deploys generated API documentation for the SDK only — the manager's public interface
# is its specification, not its source.
name: Deploy typedoc to Pages

on:
  push:
    branches: ['master']
    paths:
      - 'packages/jobnik-sdk/**'
      - 'typedoc.json'
      - '.github/workflows/typedoc.yaml'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Init nodejs
        uses: ./.github/actions/init-pnpm

      - name: Build docs
        run: pnpm run docs

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './docs/sdk'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
